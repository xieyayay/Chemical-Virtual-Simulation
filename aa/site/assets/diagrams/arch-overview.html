<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>aa 项目架构图 · 可交互总览</title>
<style>
  :root{
    --ink:#1d1d1f; --ink-2:#424245; --ink-3:#6e6e73; --mute:#86868b;

    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#f5f5f7; --ink-2:#d1d1d6; --ink-3:#a1a1a6; --mute:#86868b;
      --bg:#1c1c1e; --card:rgba(44,44,46,.72); --card-solid:#2c2c2e;
      --line:rgba(255,255,255,.12); --accent:#409cff; --accent-soft:rgba(64,156,255,.14);
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55}
  .wrap{max-width:1320px;margin:0 auto;padding:20px}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  h1{font-size:19px;margin:0;letter-spacing:-.01em}
  .meta{color:var(--mute);font-size:12px;font-family:var(--mono)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--ink-2);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:13px;transition:.15s}
  .tab:hover{border-color:var(--accent);color:var(--accent)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
  @media(max-width:900px){.stage{grid-template-columns:1fr}}
  .canvas{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto;padding:10px;min-height:560px}
  .canvas svg{display:block}
  .node{position:absolute;border:1px solid var(--line);background:var(--card-solid);border-radius:10px;padding:8px 10px;cursor:pointer;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:hidden}
  .node:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 6px 18px var(--accent-soft)}
  .node.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
  .node .t{font-weight:600;font-size:12.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node .s{font-size:11px;color:var(--mute);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node[data-kind="core"]{border-left:3px solid var(--accent)}
  .node[data-kind="debt"]{border-left:3px solid var(--bad)}
  .node[data-kind="data"]{border-left:3px solid var(--ok)}
  .node[data-kind="ui"]{border-left:3px solid var(--warn)}
  .band{position:absolute;border:1px dashed var(--line);border-radius:12px;pointer-events:none}
  .band span{position:absolute;left:10px;top:6px;font-size:11px;color:var(--mute);font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase}
  aside{position:sticky;top:20px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
  aside h2{font-size:13px;margin:0 0 8px;color:var(--mute);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
  #detail{font-size:13px}
  #detail .k{color:var(--mute);font-size:11px;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;margin-top:10px}
  #detail .v{color:var(--ink)}
  #detail code{font-family:var(--mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:4px;word-break:break-all}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--mute)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
  footer{margin-top:14px;color:var(--mute);font-size:11.5px;font-family:var(--mono)}
  .hint{font-size:12px;color:var(--mute);margin:0 0 10px}
</style>
</head>

    <aside>

    </aside>
  </div>

</div>

        d:"建议的收敛路径：BP_InteractBase + DT_InteractConfig（字段表见系统页第 8 节）；迁移要分批 + 每批回归。", doc:"systems/interaction-system.md"},

        d:"〔I〕需你在角色蓝图里确认是 Cast 到具体类还是走接口 Message。前者会让「加一个器材就要改角色」。", doc:"blueprints/blueprint-notes.md"}
    ],
    edges: [["i1","i2"],["i2","i3"],["i3","i4"],["i4","i5"],["i5","i6"],["i5","i7"],["i7","i8"],["i8","i9"],["i6","k1"],["i4","k2"]]
  }
};

const canvas = document.getElementById('canvas');
const wires = document.getElementById('wires');
const detail = document.getElementById('detail');
let active = 'arch';

function draw(viewKey){
  active = viewKey;
  const v = VIEWS[viewKey];
  canvas.style.width = v.w + 'px';
  canvas.style.height = v.h + 'px';
  canvas.querySelectorAll('.node,.band').forEach(n => n.remove());
  wires.setAttribute('width', v.w);
  wires.setAttribute('height', v.h);
  wires.setAttribute('viewBox', `0 0 ${v.w} ${v.h}`);
  wires.innerHTML = '';

  (v.bands || []).forEach(b => {
    const d = document.createElement('div');
    d.className = 'band';
    d.style.cssText = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px`;
    d.innerHTML = `<span>${b.label}</span>`;
    canvas.appendChild(d);
  });

  const pos = {};
  v.nodes.forEach(n => {
    pos[n.id] = n;
    const el = document.createElement('div');
    el.className = 'node'; el.dataset.id = n.id; el.dataset.kind = n.kind || 'core';
    el.style.cssText = `left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px`;
    el.innerHTML = `<div class="t">${n.t}</div><div class="s">${n.s || ''}</div>`;
    el.addEventListener('click', () => select(n, el));
    canvas.appendChild(el);
  });

  const ns = 'http://www.w3.org/2000/svg';
  (v.edges || []).forEach(([a, b]) => {
    const A = pos[a], B = pos[b]; if (!A || !B) return;
    const ax = A.x + A.w/2, ay = A.y + A.h, bx = B.x + B.w/2, by = B.y;
    const my = (ay + by) / 2;
    const p = document.createElementNS(ns, 'path');
    p.setAttribute('d', `M ${ax} ${ay} C ${ax} ${my}, ${bx} ${my}, ${bx} ${by}`);
    p.setAttribute('stroke', 'var(--line)');
    p.setAttribute('stroke-width', '1.5');
    p.setAttribute('fill', 'none');
    p.setAttribute('marker-end', 'url(#arw)');
    wires.appendChild(p);
  });
  const defs = document.createElementNS(ns, 'defs');
  defs.innerHTML = `<marker id="arw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)"/></marker>`;
  wires.insertBefore(defs, wires.firstChild);

  detail.innerHTML = '<span style="color:var(--mute)">点左侧任意节点</span>';
}

function select(n, el){
  canvas.querySelectorAll('.node.sel').forEach(x => x.classList.remove('sel'));
  el.classList.add('sel');
  detail.innerHTML = `
    <div style="font-weight:600;font-size:14px;margin-bottom:2px">${n.t}</div>
    <div style="color:var(--mute);font-family:var(--mono);font-size:11px">${n.s || ''}</div>
    <div class="v" style="margin-top:10px">${n.d || ''}</div>
    ${n.doc ? `<div class="k">对应文档</div><div class="v"><code>${n.doc}</code></div>` : ''}
  `;
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    draw(t.dataset.view);
  });
});

draw('arch');
</script>
</body>
</html>
